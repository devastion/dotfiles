externals:
  tmux:
    plugins:
      - 'parwest/tmux-spoony'
      - 'ddzero2c/tmux-easymotion'
      - 'wfxr/tmux-fzf-url'
      - 'abhinav/tmux-fastcopy'
      - 'tmux-plugins/tmux-resurrect'
  zsh:
    plugins:
      - 'romkatv/zsh-defer'
      - 'aloxaf/fzf-tab'
      - 'hlissner/zsh-autopair'
      - 'zsh-users/zsh-autosuggestions'
      - 'zdharma-continuum/fast-syntax-highlighting'
