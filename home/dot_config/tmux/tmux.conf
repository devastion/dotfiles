# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Server options ---
set -s default-terminal 'tmux-256color'
set -s escape-time 0
set -s editor "${EDITOR}"
set -s extended-keys always
set -s extended-keys-format xterm
set -g focus-events on
set -s get-clipboard both
set -s set-clipboard on
run-shell -b "mkdir -p '${XDG_STATE_HOME}/tmux'"
set -s history-file "${XDG_STATE_HOME}/tmux/history"
set -sa terminal-features ",xterm-*:RGB,xterm-*:usstyle,xterm-ghostty:extkeys,*:extkeys"
set -as terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'
set -sa terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -sa terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# --- Session options ---
set -g assume-paste-time 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g default-shell "${SHELL}"
set -g display-time 5000
set -g history-limit 50000
set -g repeat-time 500
set -g visual-activity off
set -g visual-bell off

# --- Window options ---
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
setw -g monitor-activity off

# Disable pane status if only one pane.
# pane-focus-in alone misses pane changes that don't move focus (e.g. killing a
# non-active pane), so layout/exit hooks are needed too; focus-in still acts as
# the self-heal for windows that changed while in the background.
set-hook -g -w window-layout-changed "setw -F pane-border-status '#{?#{e|>:#{window_panes},1},top,off}'"
set-hook -g -w pane-exited "setw -F pane-border-status '#{?#{e|>:#{window_panes},1},top,off}'"
set-hook -g -w pane-focus-in "setw -F pane-border-status '#{?#{e|>:#{window_panes},1},top,off}'"

# --- Status ---
set -g status on
set -g status-interval 10
set -g status-keys vi
set -g status-position top
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 60

set -g status-style "bg=default,fg=color8"
set -g status-left-style "bg=default,fg=color8"
set -g status-right-style "bg=default,fg=color8"

set -g status-left "#{s/ · $//:#{?client_prefix,#[fg=color2#,bold]prefix#[default] · ,}#{?pane_in_mode,#[fg=color3#,bold]copy#[default] · ,}#{?pane_synchronized,#[fg=color5#,bold]sync#[default] · ,}#{?mouse,#[fg=color1#,bold]mouse#[default] · ,}}"

set -g status-right "#[fg=color8]#{b:pane_current_command} · #[fg=color7]%H:%M · #[fg=color4#,bold]#{session_name} "

set -g window-status-separator "#[fg=color8] · "
set -g window-status-style "fg=color8"

# Window names get a width budget so the list always fits and never scrolls:
#   (client width - room for status-left/right) / window count - "#I " - " · "
# Clamped to [5,24]; under the floor, inactive windows collapse to just their
# index so the active window stays readable.
# NOTE: #W does NOT expand inside a format modifier - it silently yields an
# empty string. #{window_name} must be used instead.
set -g @win-name-raw "#{e|-:#{e|/:#{e|-:#{client_width},30},#{session_windows}},5}"
set -g @win-name-len "#{?#{e|<:#{E:@win-name-raw},5},5,#{?#{e|>:#{E:@win-name-raw},24},24,#{E:@win-name-raw}}}"
set -g @win-name-tiny "#{e|<:#{E:@win-name-raw},5}"

set -g window-status-format "#I#{?#{E:@win-name-tiny},, #{=/#{E:@win-name-len}/…:#{window_name}}}#{?window_zoomed_flag, 󰁌,}"
set -g window-status-current-style "fg=color6,bold"
set -g window-status-current-format "#I #{=/#{?#{E:@win-name-tiny},16,#{E:@win-name-len}}/…:#{window_name}}#{?window_zoomed_flag, 󰁌,}"
set -g window-status-activity-style "fg=color3"
set -g window-status-bell-style "fg=color1,bold"
set -g window-status-last-style "fg=color7"

set -g mode-style "bg=color8,fg=color3"
set -g message-style "bg=default,fg=color4,bold"
set -g message-command-style "bg=default,fg=color1,bold"
set -g copy-mode-match-style "bg=color4,fg=color0"
set -g copy-mode-current-match-style "bg=color3,fg=color0,bold"
set -g copy-mode-mark-style "bg=color5,fg=color0"

set -g pane-border-status off
set -g pane-border-format " #{pane_index}:#{b:pane_current_path} · #{pane_current_command} "
set -g pane-border-lines simple
set -g pane-border-style "bg=default,fg=color8"
set -g pane-active-border-style "bg=default,fg=color6"

set -g display-panes-colour "color8"
set -g display-panes-active-colour "color6"

set -g popup-border-style "bg=default,fg=color6"
set -g popup-border-lines rounded

set -g clock-mode-colour "color5"
set -g clock-mode-style 24

# --- Plugins ---
set -g @fzf-url-bind 'u'

set -g @fastcopy-action "tmux load-buffer -w -"
set -g @fastcopy-key "f"

# set -g @easymotion-s "j"
set -g @easymotion-s2 "j"

run-shell "${XDG_DATA_HOME}/tmux/plugins/tmux-spoony/tmux-spoony.tmux"
run-shell "${XDG_DATA_HOME}/tmux/plugins/tmux-easymotion/easymotion.tmux"
run-shell "${XDG_DATA_HOME}/tmux/plugins/tmux-fzf-url/fzf-url.tmux"
run-shell "${XDG_DATA_HOME}/tmux/plugins/tmux-fastcopy/fastcopy.tmux"

# --- Pane navigation ---
bind -n C-h if -F '#{==:#{@is-vim},1}' 'send C-h' 'select-pane -L'
bind -n C-j if -F '#{==:#{@is-vim},1}' 'send C-j' 'select-pane -D'
bind -n C-k if -F '#{==:#{@is-vim},1}' 'send C-k' 'select-pane -U'
bind -n C-l if -F '#{==:#{@is-vim},1}' 'send C-l' 'select-pane -R'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind C-p display-panes

# --- Window management ---
bind q if -F "#{e|>:#{window_panes},1}" kill-pane "confirm-before -p 'Kill window? (y/n)' kill-window"
bind c new-window -c "#{pane_current_path}"
bind z resize-pane -Z
bind m resize-pane -Z
bind w choose-tree -w
bind r command-prompt -F -I '#W' "rename-window -t '#{window_id}' '%%'"
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

bind ` last-window
bind -r h select-window -t -1
bind -r l select-window -t +1
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# --- Session management ---
bind Space choose-tree -s
bind Tab switch-client -l
bind C command-prompt -p "session name:" "new-session -s '%%'"
bind d detach-client
bind S command-prompt -F -I '#S' "rename-session -t '#{session_name}' '%%'"
bind '#' command-prompt -F -p 'New session name:' "new-session -d -s '%1'; move-window -s '#{window_id}' -t '%1:'; kill-window -t '%1:#{base-index}'; switch-client -t '%1'"

# --- Copy mode ---
setw -g mode-keys vi
set -g copy-mode-line-numbers relative
bind Enter copy-mode
bind y {
  splitw -Ef -l30%
    set-hook -p pane-mode-changed 'if -F "#{!=:#{pane_mode},copy-mode}" "kill-pane"'
    copy-mode -s'{last}'
}

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe
bind -T copy-mode-vi Y send -X copy-pipe-end-of-line
bind C-v {
  copy-mode
    send -X begin-selection
    send -X rectangle-toggle
}

# --- Popups ---
bind -N 'Kill pane' C-x popup -w 60% -h 60% -E "${XDG_CONFIG_HOME}/tmux/scripts/kill-pane"
bind -N 'Switch window' C-w popup -w 60% -h 60% -E "${XDG_CONFIG_HOME}/tmux/scripts/select-window"
bind -N 'Switch session' C-s popup -w 60% -h 60% -E "${XDG_CONFIG_HOME}/tmux/scripts/switch-session"
bind g popup -d "#{pane_current_path}" -w 100% -h 100% -E "lazygit"
bind -N 'Popup with all available keybindings' ? popup -E -w 80% -h 80% 'tmux list-keys -a | less'

# --- Utilities ---
bind M set mouse
bind b set status
bind R { source -F "${XDG_CONFIG_HOME}/tmux/tmux.conf"; display-message 'Reloaded!' }
bind C-l { send -R C-l; clear-history }

# buffers
bind B list-buffers
bind P choose-buffer
